name: Deploy Infrastructure

on:
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: 'rg-recipe-app-prod'
  AZURE_LOCATION: 'northeurope'

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      container-app-url: ${{ steps.bicep-deploy.outputs.containerAppUrl }}
      key-vault-name: ${{ steps.bicep-deploy.outputs.keyVaultName }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Create Resource Group
      run: |
        az group create \
          --name ${{ env.AZURE_RESOURCE_GROUP }} \
          --location ${{ env.AZURE_LOCATION }}
    
    - name: Check and purge soft-deleted Key Vault
      run: |
        # Check if there's a soft-deleted vault with our naming pattern
        DELETED_VAULT=$(az keyvault list-deleted \
          --query "[?starts_with(name, 'kv-recipe-prod')].name" \
          -o tsv | head -n1)
        
        if [ ! -z "$DELETED_VAULT" ]; then
          echo "⚠️ Found soft-deleted Key Vault: $DELETED_VAULT"
          echo "🗑️ Purging to allow redeployment..."
          az keyvault purge --name "$DELETED_VAULT" --no-wait
          echo "✅ Purge initiated (may take a few minutes)"
          sleep 30  # Wait a bit for purge to process
        else
          echo "✅ No soft-deleted Key Vaults found"
        fi
    
    - name: Deploy Bicep
      id: bicep-deploy
      uses: azure/arm-deploy@v1
      with:
        scope: resourcegroup
        resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
        template: ./infrastructure/main.bicep
        parameters: >
          environment=prod
          sqlAdminUsername=${{ secrets.SQL_ADMIN_USERNAME }}
          sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
          googleClientId=${{ secrets.GOOGLE_CLIENT_ID }}
          googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
          jwtSecretKey=${{ secrets.JWT_SECRET_KEY }}
          frontendUrl=${{ vars.FRONTEND_URL }}
          frontendCustomDomainName=${{ vars.FRONTEND_CUSTOM_DOMAIN }}
          frontendCustomDomainCertificateName=${{ vars.FRONTEND_CUSTOM_DOMAIN_CERT }}
        failOnStdErr: false
    
    - name: Update backend CORS and share base URL with frontend URL
      # The bicep output is the container app's ingress fqdn, which stops being the host users
      # reach once a custom domain is bound to it. Prefer PUBLIC_APP_URL so an infra deploy
      # cannot revert what the app deploy set, and keep the fqdn as a second allowed origin so
      # requests from the old host still pass CORS.
      run: |
        FQDN_URL="${{ steps.bicep-deploy.outputs.frontendUrl }}"
        FRONTEND_URL="${{ vars.PUBLIC_APP_URL }}"
        FRONTEND_URL="${FRONTEND_URL:-$FQDN_URL}"
        BACKEND_NAME=$(az containerapp list \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query "[?contains(name, 'recipe-api')].name | [0]" -o tsv)
        az containerapp update \
          --name "$BACKEND_NAME" \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --set-env-vars \
            "Cors__AllowedOrigins__0=${FRONTEND_URL}" \
            "Cors__AllowedOrigins__1=${FQDN_URL}" \
            "Sharing__PublicBaseUrl=${FRONTEND_URL}"
        echo "CORS + share base URL set to: ${FRONTEND_URL} (also allowing ${FQDN_URL})"

    - name: Display deployment info
      run: |
        echo "✅ Infrastructure deployed successfully!"
        echo "🔐 Key Vault: ${{ steps.bicep-deploy.outputs.keyVaultName }}"
        echo "🔗 Backend API: ${{ steps.bicep-deploy.outputs.containerAppUrl }}"
        echo "🔗 Frontend: ${{ steps.bicep-deploy.outputs.frontendUrl }}"
