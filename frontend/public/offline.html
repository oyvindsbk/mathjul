<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matoppskrifter — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #94a3b8; line-height: 1.6; max-width: 30ch; }
    .hint { margin-top: 1.5rem; font-size: 0.875rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="icon">🍽️</div>
  <h1>Du er offline</h1>
  <p>Ingen nettverkstilkobling. Oppskrifter du har besøkt tidligere kan fremdeles være tilgjengelige.</p>
  <p class="hint">Gå tilbake for å bla i hurtigbufret innhold.</p>
</body>
</html>
